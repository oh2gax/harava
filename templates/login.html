<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{{ app_name }} — sign in</title>
<script>
(function () {
    try {
        var m = localStorage.getItem('fwa_theme_mode');
        var light = m === 'light' || ((m !== 'dark') && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('light');
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=version) }}">
<style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-base); }
    .login-card { width: 340px; max-width: calc(100vw - 32px); background: var(--bg-surface); border: 1px solid var(--border);
                  border-radius: 10px; padding: 26px 26px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .login-card h1 { font-size: 22px; color: var(--accent); margin-bottom: 2px; }
    .login-card .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 18px; }
    .login-card label { display: block; font-size: 12px; color: var(--text-secondary); margin: 10px 0 4px; }
    .login-card input[type=text], .login-card input[type=password] { width: 100%; padding: 9px 10px; font-size: 14px;
                  background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; }
    .login-card input:focus { outline: none; border-color: var(--accent-dim); }
    .login-card .remember { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
    .login-card button { width: 100%; margin-top: 16px; padding: 10px; font-size: 14px; font-weight: 600; border: 0; border-radius: 6px;
                  background: var(--accent-btn); color: #fff; cursor: pointer; }
    .login-card button:hover { background: var(--accent-btn-hover); }
    .login-card .err { margin-top: 12px; padding: 8px 10px; border-radius: 6px; font-size: 13px;
                  color: var(--red); border: 1px solid var(--red); }
    .login-card .foot { margin-top: 16px; font-size: 11px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<form class="login-card" method="post" action="/login" autocomplete="on">
    <h1>📡 {{ app_name }}</h1>
    <div class="sub">Sign in to rake through what your phone heard.</div>
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" name="remember" value="1" checked> Keep me signed in on this device</label>
    <button type="submit">Sign in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <div class="foot">{{ app_name }} {{ version }}</div>
</form>
</body>
</html>
